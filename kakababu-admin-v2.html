<style>
:root{--bg:#08111f;--panel:#0f1b2e;--card:#13233a;--line:#233954;--text:#f5f8ff;--muted:#9eb0c8;--blue:#3b82f6;--purple:#7c3aed;--green:#10b981;--orange:#f59e0b;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0a1424;position:sticky;top:0;z-index:10}
.brand{font-size:20px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.header-actions{display:flex;gap:8px}.header-actions a,.header-actions button{border:0;border-radius:10px;padding:10px 13px;text-decoration:none;font-weight:800;cursor:pointer;background:#1d2b40;color:#fff}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}
aside{border-right:1px solid var(--line);padding:18px 12px;background:#0a1424}
aside button{width:100%;border:0;background:transparent;color:#c8d4e5;padding:12px 13px;border-radius:10px;text-align:left;font-weight:800;cursor:pointer;margin-bottom:6px}
aside button.active,aside button:hover{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff}
main{padding:20px;min-width:0}
.page{display:none}.page.active{display:block}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:5px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:7px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin-top:0}.list{display:grid;gap:9px}.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}.icon{width:40px;height:40px;border-radius:11px;background:#1c3150;display:grid;place-items:center}.grow{flex:1}.item b{font-size:13px}.item small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.chip{font-size:9px;font-weight:900;border-radius:999px;padding:5px 8px}.green{background:#0c513b;color:#8cf1c9}.orange{background:#5a3c0c;color:#ffd58a}.red{background:#5b1f24;color:#ffb0b4}.blue{background:#143f7c;color:#b9d7ff}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{color:#9eb0c8}
.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.btn.alt{background:#25364e}.btn.good{background:#0f9f6e}.btn.bad{background:#c43e46}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{background:#07111e;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.notice{margin-top:15px;padding:13px;border-radius:12px;background:#3f320e;border:1px solid #7d641a;color:#ffe5a8}
.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#172235;border-radius:999px;padding:10px 14px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}aside button{width:auto;white-space:nowrap}.stats,.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
@media(max-width:560px){header{height:auto;padding:12px}.header-actions{display:none}.stats,.cards{grid-template-columns:1fr}main{padding:12px}}
</style>

<style id="kaka-v2-polish">

<body><div class="kaka-v2-loader" id="kakaV2Loader"><div class="kaka-v2-loader-card"><div class="kaka-v2-spinner"></div><b>KAKABABU Project Preview</b><div style="margin-top:5px;font-size:12px;color:#c9ddf2">Loading secure client demo...</div></div></div>
<header>
<div class="brand">KAKABABU Admin Panel Demo<small>Client-safe project view • No login required</small></div>
<div class="header-actions"><a href="kakababu-project-v2.html">← Project Home</a><button onclick="restart()">Restart Demo</button></div>
</header>

<section id="vehicles" class="page"></section><section id="verificationCenter" class="page"></section><section id="categoryManagement" class="page"></section><section id="settlementManagement" class="page"></section><section id="refundManagement" class="page"></section><section id="notificationManagement" class="page"></section><section id="auditLog" class="page"></section><section id="professionalServices" class="page"></section><section id="bookingManagement" class="page"></section><section id="reviewManagement" class="page"></section><section id="gstManagement" class="page"></section><section id="mentors" class="page"></section><section id="payments" class="page"></section>
<section id="approvals" class="page"></section>

<script>
const pages=[
['dashboard','📊 Dashboard'],['users','👥 Users'],['vendors','🏪 Vendors'],['orders','📦 Orders'],
['services','🧰 Services'],['vehicles','🚗 Vehicles'],['verificationCenter','🗂️ Document Verification'],['categoryManagement','🗂️ Category Management'],['settlementManagement','💰 Settlements'],['refundManagement','↩️ Refunds'],['notificationManagement','🔔 Notifications'],['auditLog','📜 Audit Log'],['professionalServices','🧰 Service Management'],['bookingManagement','📦 Booking Management'],['reviewManagement','⭐ Review Moderation'],['gstManagement','🧾 GST Management'],['mentors','🧑‍🏫 Mentors'],['payments','💰 Payments'],['approvals','✅ Approvals'],['notifications','🔔 Notifications'],['settings','⚙️ Settings']
];
let vendorPending=3,orderPending=8,paymentPending=18500;





const DEMO_KEYS={
  bookings:'kakababu_demo_bookings',
  services:'kakababu_demo_services',
  documents:'kakababu_demo_documents',
  notifications:'kakababu_demo_notifications',
  vendors:'kakababu_demo_vendors',
  users:'kakababu_demo_users'
};
function demoRead(key,fallback=[]){
  try{
    const value=JSON.parse(localStorage.getItem(key)||'null');
    return value===null?fallback:value;
  }catch(e){return fallback}
}
function demoWrite(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

let categoryManagement=[
 {category:'Education',sub:['Online Tutor','Offline Tutor','Uniform Booking','Admission','Re-Admission']},
 {category:'Home Service',sub:['AC Repair','Electrician','Plumber','Cleaning']},
 {category:'Transportation',sub:['Driver','Car Rental','Bike Rental']}
];
let settlementManagement=[
 {vendor:'Smart Tutor Hub',amount:12500,status:'Pending'},
 {vendor:'City Car Rental',amount:8200,status:'Approved'}
];
let refundManagement=[
 {booking:'KB782145',user:'Sangita Das',amount:499,status:'Pending'}
];
let notificationManagement=[
 {title:'Booking Update',message:'Your booking is confirmed',status:'Draft'}
];
let auditLogs=[{time:new Date().toLocaleString(),action:'Admin panel loaded'}];

function addAudit(action){auditLogs.unshift({time:new Date().toLocaleString(),action});renderCompletionAdmin()}
function adminBookings(){return demoRead(DEMO_KEYS.bookings,bookingManagement||[])}
function adminDocuments(){return demoRead(DEMO_KEYS.documents,(verificationRecords[0]&&verificationRecords[0].docs)||[])}

function renderCompletionAdmin(){
  const c=document.getElementById('categoryManagement');
  const s=document.getElementById('settlementManagement');
  const r=document.getElementById('refundManagement');
  const n=document.getElementById('notificationManagement');
  const a=document.getElementById('auditLog');
  if(c)c.innerHTML=`<div class="page-head"><div><h1>Category & Sub-category Management</h1><p>Add, edit and delete service categories</p></div></div>${categoryManagement.map((x,i)=>`<div class="simple-admin-item"><h3>${x.category}</h3><p class="meta">${x.sub.join(', ')}</p><div class="simple-admin-actions"><button class="btn" onclick="const v=prompt('Edit category',categoryManagement[${i}].category);if(v){categoryManagement[${i}].category=v;addAudit('Category edited')}">Edit</button><button class="btn" onclick="const v=prompt('Add sub-category');if(v){categoryManagement[${i}].sub.push(v);addAudit('Sub-category added')}">Add Sub-category</button><button class="btn reject" onclick="categoryManagement.splice(${i},1);addAudit('Category deleted')">Delete</button></div></div>`).join('')}<button class="btn approve" onclick="const v=prompt('New category');if(v){categoryManagement.push({category:v,sub:[]});addAudit('Category added')}">Add Category</button>`;
  if(s)s.innerHTML=`<div class="page-head"><div><h1>Payment Settlement</h1><p>Approve or reject vendor settlement</p></div></div>${settlementManagement.map((x,i)=>`<div class="simple-admin-item"><h3>${x.vendor}</h3><p class="meta">₹${x.amount} • ${x.status}</p><button class="btn approve" onclick="settlementManagement[${i}].status='Approved';addAudit('Settlement approved')">Approve</button><button class="btn reject" onclick="settlementManagement[${i}].status='Rejected';addAudit('Settlement rejected')">Reject</button></div>`).join('')}`;
  if(r)r.innerHTML=`<div class="page-head"><div><h1>Refund & Cancellation</h1><p>Manage refund requests</p></div></div>${refundManagement.map((x,i)=>`<div class="simple-admin-item"><h3>${x.booking}</h3><p class="meta">${x.user} • ₹${x.amount} • ${x.status}</p><button class="btn approve" onclick="refundManagement[${i}].status='Approved';addAudit('Refund approved')">Approve</button><button class="btn reject" onclick="refundManagement[${i}].status='Rejected';addAudit('Refund rejected')">Reject</button></div>`).join('')}`;
  if(n)n.innerHTML=`<div class="page-head"><div><h1>Notification Management</h1><p>Create and send demo notifications</p></div></div><div class="admin-form-grid"><input id="notifyTitle" placeholder="Notification title"><input id="notifyMessage" placeholder="Message"></div><button class="btn approve" onclick="const list=demoRead(DEMO_KEYS.notifications,[]);list.unshift({title:notifyTitle.value,message:notifyMessage.value,date:new Date().toLocaleString()});demoWrite(DEMO_KEYS.notifications,list);addAudit('Notification sent');toast('Demo notification sent')">Send Notification</button>`;
  if(a)a.innerHTML=`<div class="page-head"><div><h1>Audit Log</h1><p>Admin changes and actions</p></div></div>${auditLogs.map(x=>`<div class="audit-item"><b>${x.action}</b><p class="meta">${x.time}</p></div>`).join('')}`;
}

let professionalServices=[
 {name:'Online Tutor',vendor:'Smart Tutor Hub',category:'Education',price:899,rating:4.8,status:'Active'},
 {name:'AC Repair',vendor:'Cool Care Service',category:'Home Service',price:499,rating:4.7,status:'Pending'},
 {name:'Outstation Driver',vendor:'City Car Rental',category:'Transportation',price:899,rating:4.6,status:'Active'},
 {name:'Uniform Booking',vendor:'School Dress House',category:'Education',price:1080,rating:4.5,status:'Pending'}
];
function renderProfessionalServices(){
 const page=document.getElementById('professionalServices');
 if(!page)return;
 page.innerHTML=`<div class="page-head"><div><h1>Service Management</h1><p>View, edit, approve and manage all service listings</p></div></div><div class="admin-service-list">${professionalServices.map((s,i)=>`<div class="admin-service-card"><h3>${s.name}</h3><div class="meta">Vendor: ${s.vendor}<br>Category: ${s.category}<br>Price: ₹${s.price}<br>Rating: ⭐ ${s.rating}<br>Status: ${s.status}</div><div class="admin-service-actions"><button class="btn" onclick="toast('Service details opened')">View</button><button class="btn" onclick="toast('Edit service opened')">Edit</button><button class="btn approve" onclick="professionalServices[${i}].status='Active';renderProfessionalServices()">Approve</button><button class="btn reject" onclick="professionalServices[${i}].status='Rejected';renderProfessionalServices()">Reject</button></div></div>`).join('')}</div>`;
}

let bookingManagement=[
 {id:'KB782145',user:'Sangita Das',service:'Online Tutor',amount:1179,status:'Pending'},
 {id:'KB782146',user:'Rahul Kumar',service:'AC Repair',amount:637,status:'Confirmed'}
];
let reviewManagement=[
 {user:'Sangita Das',service:'Online Tutor',rating:5,text:'Very helpful service',status:'Pending'},
 {user:'Amit Kumar',service:'AC Repair',rating:4,text:'Good service',status:'Approved'}
];
let gstManagement=[
 {service:'Online Tutor',vendor:'Smart Tutor Hub',mode:'GST Extra 18%',status:'Active'},
 {service:'AC Repair',vendor:'Cool Care Service',mode:'No GST',status:'Active'}
];
function updateBookingAdmin(i,status){bookingManagement[i].status=status;toast('Booking '+status.toLowerCase());renderPhase5Management()}
function updateReviewAdmin(i,status){reviewManagement[i].status=status;toast('Review '+status.toLowerCase());renderPhase5Management()}
function updateGSTAdmin(i){
  const next=prompt('GST mode: GST Included / GST Extra 18% / No GST',gstManagement[i].mode);
  if(next){gstManagement[i].mode=next;renderPhase5Management()}
}
function renderPhase5Management(){
  const b=document.getElementById('bookingManagement');

function statusClass(status){
  if(status==='Approved') return 'status-approved';
  if(status==='Rejected') return 'status-rejected';
  return 'status-pending';
}

function setVerificationFilter(filter){
  verificationFilter=filter;
  renderCompletionAdmin();renderProfessionalServices();renderPhase5Management();renderVerificationCenter();
}

function updateVerificationStatus(index,status){
  const filtered=verificationRecords.filter(r=>verificationFilter==='All'||r.status===verificationFilter);
  const record=filtered[index];
  if(!record)return;
  const realIndex=verificationRecords.findIndex(r=>r.id===record.id);
  verificationRecords[realIndex].status=status;demoWrite(DEMO_KEYS.documents,verificationRecords);
  const note=document.getElementById('note-'+record.id);
  if(note) verificationRecords[realIndex].notes=note.value.trim();
  toast(record.type+' verification '+status.toLowerCase());
  renderVerificationCenter();
}

function editVerificationRecord(id){
  const r=verificationRecords.find(x=>x.id===id);
  if(!r)return;
  const name=prompt('Edit name/title',r.name);
  if(name!==null&&name.trim())r.name=name.trim();
  const owner=prompt('Edit vendor/owner',r.owner);
  if(owner!==null&&owner.trim())r.owner=owner.trim();
  renderVerificationCenter();
}

function manageVerificationRecord(id){
  const r=verificationRecords.find(x=>x.id===id);
  if(!r)return;
  const note=prompt('Admin management note',r.notes||'');
  if(note!==null)r.notes=note;
  renderVerificationCenter();
}

function viewDocument(recordId,docIndex){
  const r=verificationRecords.find(x=>x.id===recordId);
  if(!r)return;
  const d=r.docs[docIndex];
  const modal=document.getElementById('documentModal');
  document.getElementById('modalTitle').textContent=d.name;
  document.getElementById('modalMeta').innerHTML=`Record: ${r.id}<br>Owner: ${r.owner}<br>File: ${d.file}<br>Status: ${d.status}`;
  document.getElementById('modalPreview').innerHTML=`
    <div style="text-align:center;padding:30px">
      <div style="font-size:58px">📄</div>
      <h3>${d.name}</h3>
      <p>${d.file}</p>
      <p class="meta">Uploaded document preview will appear here.</p>
    </div>`;
  modal.classList.add('show');
}

function editDocument(recordId,docIndex){
  const r=verificationRecords.find(x=>x.id===recordId);
  if(!r)return;
  const d=r.docs[docIndex];
  const file=prompt('Edit document file name',d.file);
  if(file!==null&&file.trim())d.file=file.trim();
  const status=prompt('Document status: Uploaded / Verified / Reupload Required',d.status);
  if(status!==null&&status.trim())d.status=status.trim();
  renderVerificationCenter();
}

function manageDocument(recordId,docIndex){
  const r=verificationRecords.find(x=>x.id===recordId);
  if(!r)return;
  const d=r.docs[docIndex];
  const action=prompt('Enter management action: Verify / Reupload / Remove',d.status);
  if(action===null)return;
  if(action.toLowerCase().includes('verify'))d.status='Verified';
  else if(action.toLowerCase().includes('reupload'))d.status='Reupload Required';
  else if(action.toLowerCase().includes('remove'))d.status='Removed';
  renderVerificationCenter();
}

function closeDocumentModal(){
  document.getElementById('documentModal').classList.remove('show');
}


function mergeSharedVendorDocuments(){
  const shared=demoRead(DEMO_KEYS.documents,[]);
  if(!Array.isArray(shared)||!shared.length)return;
  const docs=shared.map(d=>({
    name:d.name||'Vendor Document',
    file:d.file||'No file uploaded',
    status:d.status||'Pending'
  }));
  const existing=verificationRecords.find(r=>r.id==='VER-VENDOR-SHARED');
  if(existing)existing.docs=docs;
  else verificationRecords.unshift({
    id:'VER-VENDOR-SHARED',
    type:'Vendor',
    name:'Vendor Uploaded Documents',
    owner:'KAKABABU Partner',
    status:docs.every(d=>d.status==='Approved')?'Approved':'Pending',
    notes:'Documents uploaded from Vendor App.',
    docs
  });
}

function renderVerificationCenter(){
  mergeSharedVendorDocuments();
  const page=document.getElementById('verificationCenter');
  if(!page)return;
  const records=verificationRecords.filter(r=>verificationFilter==='All'||r.status===verificationFilter);
  page.innerHTML=`<div class="page-head"><div><h1>Document Verification & Management</h1><p>Vendor, vehicle, driver, mentor, qualification and bank documents</p></div></div>
  <div class="verify-toolbar">
    ${['All','Pending','Approved','Rejected'].map(f=>`<button class="verify-filter ${verificationFilter===f?'active':''}" onclick="setVerificationFilter('${f}')">${f}</button>`).join('')}
  </div>
  <div class="approval-grid">
    ${records.map((r,i)=>`<div class="verify-card">
      <div class="verify-head">
        <div class="verify-title"><div class="verify-icon">${r.type==='Vehicle'?'🚗':r.type==='Mentor'?'🧑‍🏫':'🏦'}</div><div><h3>${r.name}</h3><div class="verify-meta">${r.id}<br>${r.owner}</div></div></div>
        <span class="status-badge ${statusClass(r.status)}">${r.status}</span>
      </div>
      <div class="verify-docs">
        ${r.docs.map((d,di)=>`<div class="doc-item"><b>${d.name}</b><span>${d.file}</span><br><small>Status: ${d.status}</small>
          <div class="doc-actions">
            <button class="view-doc" onclick="viewDocument('${r.id}',${di})">View</button>
            <button class="edit-doc" onclick="editDocument('${r.id}',${di})">Edit</button>
            <button class="manage-doc" onclick="manageDocument('${r.id}',${di})">Manage</button>

        </div>`).join('')}
      </div>
      <textarea id="note-${r.id}" class="note-area" placeholder="Admin verification note">${r.notes||''}</textarea>
      <div class="action-row">
        <button class="btn approve" onclick="updateVerificationStatus(${i},'Approved')">Approve</button>
        <button class="btn reject" onclick="updateVerificationStatus(${i},'Rejected')">Reject</button>
        <button class="btn" onclick="editVerificationRecord('${r.id}')">Edit Record</button>
        <button class="btn" onclick="manageVerificationRecord('${r.id}')">Manage</button>
      </div>
    </div>`).join('')}
  </div>`;
}
