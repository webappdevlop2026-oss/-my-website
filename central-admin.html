<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta content="noindex, nofollow" name="robots"/><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Admin — Digital Agency by Chandan Das</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-client.js"></script>
<style>
:root{--bg:#07101d;--panel:#0e1a2b;--card:#132238;--line:#233751;--text:#ecf4ff;--muted:#91a4bd;--blue:#36a3ff;--cyan:#34d8d1;--green:#32c787;--yellow:#f3b84b;--red:#ff6474}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#153e64,transparent 35%),var(--bg)}.login-card{width:min(430px,100%);background:rgba(14,26,43,.96);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 30px 80px #0008}.logo{width:65px;height:65px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-size:30px;font-weight:900}.login h1{margin:18px 0 5px}.login p{color:var(--muted);margin:0 0 22px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#bfd0e6}.field input,.field select,.field textarea{width:100%;background:#091524;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--blue),#5967ff);color:white}.btn.secondary{background:#172a43;border:1px solid var(--line)}.btn.danger{background:#6d2632}.btn.success{background:#146d4e}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:270px;background:#091524;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}.brand{padding:20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.brand strong,.brand span{display:block}.brand span{color:var(--muted);font-size:11px}.nav{padding:12px;overflow:auto}.nav button{width:100%;border:0;background:transparent;color:#a9bad0;text-align:left;padding:12px;border-radius:10px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#15304d;color:#fff}.main{margin-left:270px;width:calc(100% - 270px)}.top{height:75px;display:flex;align-items:center;padding:0 22px;background:#0b1726;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top h2{margin:0}.top small{color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:8px}.content{padding:20px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.stat b{font-size:28px;display:block;color:var(--cyan)}.stat span{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{background:#091524;color:white;border:1px solid var(--line);padding:9px;border-radius:9px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}th{background:#11243a;color:#7ed9ff}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#22364e}.badge.New,.badge.Pending,.badge.Urgent{background:#5e4617;color:#ffd982}.badge.Completed,.badge.Approved,.badge.Paid{background:#164c3c;color:#8dffd2}.badge.Rejected,.badge.Blocked{background:#592431;color:#ffacb8}.tab{display:none}.tab.active{display:block}.chat-layout{display:grid;grid-template-columns:300px 1fr;gap:13px}.client-list{max-height:620px;overflow:auto}.client-item{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}.client-item.active{border-color:var(--cyan);background:#102d3c}.messages{height:460px;overflow:auto;background:#07101d;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.msg{max-width:76%;padding:9px 11px;border-radius:13px}.msg.admin{align-self:flex-end;background:#205fa2}.msg.client{align-self:flex-start;background:#1a2b42}.msg small{display:block;color:#b7c6d8;font-size:9px;margin-top:4px}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{flex:1;background:#091524;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;resize:none}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.menu{display:none}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:780px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menu{display:block}.content{padding:12px}.stats{grid-template-columns:1fr 1fr}.chat-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head><body>
<section id="login" class="login"><div class="login-card"><div class="logo">DA</div><h1>Central Admin Control</h1><p>Website, Client Room, Projects, Feedback ও Chat এক জায়গায়।</p><div class="field"><label>Admin Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn" style="width:100%;margin-top:10px" onclick="login()">Secure Login</button><div id="loginError" style="color:#ff8b99;margin-top:10px"></div></div></section>
<div id="app" class="app hidden"><aside id="side" class="side"><div class="brand"><div class="logo" style="width:44px;height:44px;font-size:18px">DA</div><div><strong>Central Admin</strong><span>Digital Agency by Chandan Das</span></div></div><nav class="nav" id="nav"></nav><div style="margin-top:auto;padding:12px"><button class="btn danger" style="width:100%" onclick="auth.signOut()">Logout</button></div></aside><main class="main"><header class="top"><button class="btn secondary menu" onclick="side.classList.toggle('open')">☰</button><div style="margin-left:10px"><h2 id="title">Dashboard</h2><small id="subtitle">All business activity overview</small></div><div class="top-actions"><a class="btn secondary" href="index.html" target="_blank" style="text-decoration:none">Website</a><a class="btn secondary" href="client-room-admin.html" target="_blank" style="text-decoration:none">Full Client Room</a></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div style="display:flex;justify-content:space-between"><h3 id="modalTitle"></h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id);let cache={feedback:[],clients:[],projects:[],requests:[],tasks:[],demos:[]};let selectedChatClient=null,chatUnsub=null;
const navItems=[['dashboard','▦','Dashboard'],['projects','📁','Projects'],['feedback','📝','Client Feedback'],['clients','👥','Client Room Clients'],['requests','✨','Feature Requests'],['chat','💬','Live Chat'],['demos','🔗','Demo & APK Links'],['tasks','✅','Tasks / Workflow'],['website','🌐','Website Control'],['settings','⚙','Admin Settings']];
function renderNav(){nav.innerHTML=navItems.map(x=>`<button data-tab="${x[0]}" onclick="openTab('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
async function login(){loginError.textContent='';try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(e){loginError.textContent=e.message}}
auth.onAuthStateChanged(user=>{if(user){login.classList.add('hidden');app.classList.remove('hidden');renderNav();openTab('dashboard')}else{app.classList.add('hidden');login.classList.remove('hidden')}});
async function docs(col){const s=await db.collection(col).get();return s.docs.map(d=>({id:d.id,...d.data()}))}
function ts(v){try{return v?.toDate?v.toDate().toLocaleString():v?new Date(v).toLocaleString():'-'}catch{return '-'}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function badge(v){return `<span class="badge ${esc(v)}">${esc(v||'New')}</span>`}
async function refreshAll(){const results=await Promise.allSettled([docs('project_feedback'),docs('room_clients'),docs('room_projects'),docs('room_feature_requests'),docs('agency_tasks'),docs('agency_demo_links')]);['feedback','clients','projects','requests','tasks','demos'].forEach((k,i)=>cache[k]=results[i].status==='fulfilled'?results[i].value:[])}
async function openTab(name){side.classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));const n=navItems.find(x=>x[0]===name);title.textContent=n[2];subtitle.textContent={dashboard:'All business activity overview',projects:'Manage every client project',feedback:'KAKABABU, Calendar and future form submissions',clients:'Client Room client records and access',requests:'Feature requests and project reviews',chat:'Chat with Client Room users',demos:'Demo URL, PIN, APK and release management',tasks:'Track advance, demo, feedback, development and delivery',website:'Open existing website management tools',settings:'Admin and database setup'}[name];content.innerHTML='<div class="card">Loading...</div>';await refreshAll();pages[name]();}
const pages={dashboard(){content.innerHTML=`<div class="stats">${stat('Projects',cache.projects.length)}${stat('Clients',cache.clients.length)}${stat('New Feedback',cache.feedback.filter(x=>(x.status||'New')==='New').length)}${stat('Feature Requests',cache.requests.length)}${stat('Pending Tasks',cache.tasks.filter(x=>x.status!=='Completed').length)}</div><div class="grid2"><div class="card"><h3>Recent Feedback</h3>${cache.feedback.sort(sortDate).slice(0,6).map(feedbackMini).join('')||empty()}</div><div class="card"><h3>Project Workflow</h3>${cache.tasks.sort(sortDate).slice(0,6).map(x=>`<div class="client-item"><b>${esc(x.title)}</b><div>${esc(x.project_name||'General')} • ${badge(x.status)}</div></div>`).join('')||empty()}</div></div>`},projects(){content.innerHTML=toolbar('+ Add Project','addProject()')+table(['Client','Project','Status','Progress','Updated','Action'],cache.projects.map(x=>[x.client_name||clientName(x.client_id),x.project_name||x.title||'-',badge(x.status),`${x.progress||0}%`,ts(x.updated_at||x.created_at),actions(`editProject('${x.id}')`,`removeDoc('room_projects','${x.id}','projects')`)]))},feedback(){content.innerHTML=`<div class="toolbar"><input id="fbSearch" placeholder="Search client/project" oninput="renderFeedback()"><select id="fbStatus" onchange="renderFeedback()"><option value="">All Status</option><option>New</option><option>Reviewed</option><option>Quoted</option><option>Approved</option><option>Completed</option></select></div><div id="feedbackTable"></div>`;renderFeedback()},clients(){content.innerHTML=table(['Client','PIN','Mobile','Status','Projects','Action'],cache.clients.map(x=>[x.client_name||'-',x.client_pin||x.client_code||'-',x.phone||x.mobile||'-',badge(x.is_active===false?'Blocked':'Active'),cache.projects.filter(p=>p.client_id===x.id).length,`<button class="btn secondary" onclick="showClient('${x.id}')">View</button>`]))},requests(){content.innerHTML=table(['Client','Project','Request / Review','Status','Date','Action'],cache.requests.sort(sortDate).map(x=>[clientName(x.client_id),projectName(x.project_id),x.request_text||x.message||x.review_message||'-',badge(x.status),ts(x.created_at),`<button class="btn success" onclick="setStatus('room_feature_requests','${x.id}','Completed','requests')">Complete</button>`]))},chat(){renderChat()},demos(){content.innerHTML=toolbar('+ Add Demo Link','addDemo()')+table(['Project','Demo URL','PIN','APK / Release','Version','Action'],cache.demos.map(x=>[x.project_name||'-',link(x.demo_url),x.pin||'-',link(x.apk_url||x.release_url),x.version||'-',actions(`editDemo('${x.id}')`,`removeDoc('agency_demo_links','${x.id}','demos')`)]))},tasks(){content.innerHTML=toolbar('+ Add Task','addTask()')+table(['Task','Project','Client','Due','Status','Action'],cache.tasks.map(x=>[x.title||'-',x.project_name||'-',x.client_name||'-',x.due_date||'-',badge(x.status),`<button class="btn success" onclick="setStatus('agency_tasks','${x.id}','Completed','tasks')">Complete</button> <button class="btn danger" onclick="removeDoc('agency_tasks','${x.id}','tasks')">Delete</button>`]))},website(){content.innerHTML=`<div class="grid2"><div class="card"><h3>Existing Admin Tools</h3>${tool('Main Agency Admin','agency-admin-2026.html')}${tool('Agency Control','agency-control-2026.html')}${tool('Client Room Admin','client-room-admin.html')}${tool('Secure Requirement Portal','secure-admin-portal/index.html')}</div><div class="card"><h3>Public Pages</h3>${tool('Main Website','index.html')}${tool('KAKABABU Demo','kakababu.html')}${tool('Bangla Calendar Demo','bangla-calendar.html')}${tool('Client Room','client-room.html')}</div></div>`},settings(){content.innerHTML=`<div class="grid2"><div class="card"><h3>Firebase Admin Login</h3><p style="color:var(--muted)">এই panel Firebase Authentication email/password দিয়ে সুরক্ষিত। Firebase Console → Authentication-এ admin user তৈরি করুন।</p><button class="btn secondary" onclick="window.open('https://console.firebase.google.com/','_blank')">Open Firebase Console</button></div><div class="card"><h3>Data Collections</h3><p>project_feedback, agency_tasks, agency_demo_links, room_clients, room_projects, room_feature_requests, room_chats</p><p style="color:var(--muted)">Updated firestore.rules deploy করা আবশ্যক।</p></div></div>`}};
function stat(l,v){return `<div class="stat"><b>${v}</b><span>${l}</span></div>`}function sortDate(a,b){return (b.created_at?.seconds||0)-(a.created_at?.seconds||0)}function empty(){return '<div class="empty">No data yet</div>'}function toolbar(label,fn){return `<div class="toolbar"><button class="btn" onclick="${fn}">${label}</button><button class="btn secondary" onclick="openTab(document.querySelector('.nav button.active').dataset.tab)">Refresh</button></div>`}function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}">${empty()}</td></tr>`}</tbody></table></div>`}function actions(edit,del){return `<button class="btn secondary" onclick="${edit}">Edit</button> <button class="btn danger" onclick="${del}">Delete</button>`}function link(u){return u?`<a href="${esc(u)}" target="_blank" style="color:#68c9ff">Open</a>`:'-'}function tool(n,u){return `<a href="${u}" target="_blank" class="client-item" style="display:block;color:white;text-decoration:none">${n} →</a>`}function clientName(id){return cache.clients.find(x=>x.id===id)?.client_name||'-'}function projectName(id){return cache.projects.find(x=>x.id===id)?.project_name||'-'}
function feedbackMini(x){return `<div class="client-item"><b>${esc(x.client_name||x.name||'-')} — ${esc(x.project_name||x.project||'-')}</b><div>${esc(x.feedback||x.demo_feedback||x.decision||x.extra_details||'New feedback')}</div><small>${ts(x.created_at)}</small></div>`}
function renderFeedback(){const q=(fbSearch?.value||'').toLowerCase(),s=fbStatus?.value||'';const rows=cache.feedback.filter(x=>(!s||(x.status||'New')===s)&&JSON.stringify(x).toLowerCase().includes(q)).sort(sortDate).map(x=>[x.project_name||x.project||'-',x.client_name||x.name||'-',x.mobile||'-',x.decision||x.client_decision||x.feedback||'-',badge(x.status||'New'),ts(x.created_at),`<button class="btn secondary" onclick="showFeedback('${x.id}')">View</button> <button class="btn success" onclick="setStatus('project_feedback','${x.id}','Reviewed','feedback')">Reviewed</button>`]);feedbackTable.innerHTML=table(['Project','Client','Mobile','Decision / Feedback','Status','Date','Action'],rows)}
function renderChat(){content.innerHTML=`<div class="chat-layout"><div class="card"><h3>Clients</h3><div id="chatClients" class="client-list"></div></div><div class="card"><h3 id="chatTitle">Client select করুন</h3><div id="messages" class="messages"><div class="empty">Client select করলে chat দেখা যাবে</div></div><div class="compose"><textarea id="chatText" rows="2" placeholder="Message..."></textarea><button class="btn" onclick="sendChat()">Send</button></div></div></div>`;chatClients.innerHTML=cache.clients.map(x=>`<div class="client-item" onclick="selectChat('${x.id}')"><b>${esc(x.client_name)}</b><div>${esc(x.phone||x.mobile||'')}</div></div>`).join('')||empty()}
function selectChat(id){selectedChatClient=cache.clients.find(x=>x.id===id);chatTitle.textContent='Chat — '+selectedChatClient.client_name;document.querySelectorAll('.client-item').forEach(x=>x.classList.remove('active'));if(chatUnsub)chatUnsub();chatUnsub=db.collection('room_chats').where('client_id','==',id).onSnapshot(s=>{const arr=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created_at?.seconds||0)-(b.created_at?.seconds||0));messages.innerHTML=arr.map(m=>`<div class="msg ${m.sender==='admin'?'admin':'client'}">${esc(m.message)}<small>${m.sender||'client'} • ${ts(m.created_at)}</small></div>`).join('')||empty();messages.scrollTop=messages.scrollHeight})}
async function sendChat(){if(!selectedChatClient||!chatText.value.trim())return;await db.collection('room_chats').add({client_id:selectedChatClient.id,client_name:selectedChatClient.client_name,sender:'admin',message:chatText.value.trim(),created_at:firebase.firestore.FieldValue.serverTimestamp(),read_by_admin:true,read_by_client:false});chatText.value=''}
function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
function formField(l,id,v='',type='text'){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`}function selectField(l,id,v,opts){return `<div class="field"><label>${l}</label><select id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`}
function addProject(){openModal('Add Project',`<div class="form-grid">${formField('Client Name','pClient')}${formField('Project Name','pName')}${selectField('Status','pStatus','Planning',['Planning','Demo Sent','Feedback Received','Development','Testing','Completed'])}${formField('Progress %','pProgress','0','number')}<div class="field full"><label>Note</label><textarea id="pNote"></textarea></div></div><button class="btn" onclick="saveProject()">Save</button>`)}async function saveProject(id){const data={client_name:pClient.value.trim(),project_name:pName.value.trim(),status:pStatus.value,progress:Number(pProgress.value||0),note:pNote.value.trim(),updated_at:firebase.firestore.FieldValue.serverTimestamp()};if(id)await db.collection('room_projects').doc(id).set(data,{merge:true});else{data.created_at=firebase.firestore.FieldValue.serverTimestamp();await db.collection('room_projects').add(data)}closeModal();openTab('projects')}
function editProject(id){const x=cache.projects.find(y=>y.id===id);openModal('Edit Project',`<div class="form-grid">${formField('Client Name','pClient',x.client_name)}${formField('Project Name','pName',x.project_name)}${selectField('Status','pStatus',x.status,['Planning','Demo Sent','Feedback Received','Development','Testing','Completed'])}${formField('Progress %','pProgress',x.progress||0,'number')}<div class="field full"><label>Note</label><textarea id="pNote">${esc(x.note||'')}</textarea></div></div><button class="btn" onclick="saveProject('${id}')">Update</button>`)}
function addDemo(){openModal('Add Demo',`<div class="form-grid">${formField('Project','dProject')}${formField('Version','dVersion')}${formField('Demo URL','dUrl')}${formField('PIN','dPin')}${formField('APK / Release URL','dApk')}<div class="field full"><label>Note</label><textarea id="dNote"></textarea></div></div><button class="btn" onclick="saveDemo()">Save</button>`)}async function saveDemo(id){const data={project_name:dProject.value.trim(),version:dVersion.value.trim(),demo_url:dUrl.value.trim(),pin:dPin.value.trim(),apk_url:dApk.value.trim(),note:dNote.value.trim(),updated_at:firebase.firestore.FieldValue.serverTimestamp()};if(id)await db.collection('agency_demo_links').doc(id).set(data,{merge:true});else{data.created_at=firebase.firestore.FieldValue.serverTimestamp();await db.collection('agency_demo_links').add(data)}closeModal();openTab('demos')}function editDemo(id){const x=cache.demos.find(y=>y.id===id);openModal('Edit Demo',`<div class="form-grid">${formField('Project','dProject',x.project_name)}${formField('Version','dVersion',x.version)}${formField('Demo URL','dUrl',x.demo_url)}${formField('PIN','dPin',x.pin)}${formField('APK / Release URL','dApk',x.apk_url||x.release_url)}<div class="field full"><label>Note</label><textarea id="dNote">${esc(x.note||'')}</textarea></div></div><button class="btn" onclick="saveDemo('${id}')">Update</button>`)}
function addTask(){openModal('Add Task',`<div class="form-grid">${formField('Task Title','tTitle')}${formField('Project','tProject')}${formField('Client','tClient')}${formField('Due Date','tDue','','date')}${selectField('Status','tStatus','Pending',['Pending','In Progress','Waiting Client','Completed'])}<div class="field full"><label>Note</label><textarea id="tNote"></textarea></div></div><button class="btn" onclick="saveTask()">Save</button>`)}async function saveTask(){await db.collection('agency_tasks').add({title:tTitle.value.trim(),project_name:tProject.value.trim(),client_name:tClient.value.trim(),due_date:tDue.value,status:tStatus.value,note:tNote.value.trim(),created_at:firebase.firestore.FieldValue.serverTimestamp()});closeModal();openTab('tasks')}
function showFeedback(id){const x=cache.feedback.find(y=>y.id===id);openModal('Feedback Details',`<div class="form-grid">${Object.entries(x).filter(([k])=>!['id'].includes(k)).map(([k,v])=>`<div class="field ${typeof v==='string'&&v.length>70?'full':''}"><label>${esc(k)}</label><div style="padding:10px;background:#091524;border-radius:9px;white-space:pre-wrap">${esc(v?.toDate?ts(v):Array.isArray(v)?v.join(', '):v)}</div></div>`).join('')}</div><div style="margin-top:12px"><button class="btn" onclick="setStatus('project_feedback','${id}','Quoted','feedback');closeModal()">Mark Quoted</button> <button class="btn success" onclick="setStatus('project_feedback','${id}','Approved','feedback');closeModal()">Approved</button></div>`)}function showClient(id){const x=cache.clients.find(y=>y.id===id);openModal('Client Details',`<div class="form-grid">${Object.entries(x).filter(([k])=>k!=='id').map(([k,v])=>`<div class="field"><label>${esc(k)}</label><div style="padding:10px;background:#091524;border-radius:9px">${esc(v?.toDate?ts(v):v)}</div></div>`).join('')}</div>`)}
async function setStatus(col,id,status,tab){await db.collection(col).doc(id).set({status,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});openTab(tab)}async function removeDoc(col,id,tab){if(!confirm('Delete করবেন?'))return;await db.collection(col).doc(id).delete();openTab(tab)}
</script></body></html>
