<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta content="noindex, nofollow" name="robots"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bangla Calendar Admin Preview</title>
<script>(function(){if(sessionStorage.getItem('banglaCalendarDemoUnlocked')!=='yes'||sessionStorage.getItem('banglaSelectedView')!=='admin')location.replace('bangla-calendar.html')})();</script>
<style>
:root{--bg:#0b1020;--panel:#111a30;--card:#17233d;--line:#293957;--text:#f7f9ff;--muted:#9fafc8;--p:#db2777;--p2:#7c3aed;--green:#10b981;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}header{height:68px;background:#0e172a;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}.back{color:#fff;text-decoration:none;background:#24324b;padding:10px 13px;border-radius:10px;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{padding:16px 11px;border-right:1px solid var(--line)}aside button{width:100%;border:0;background:transparent;color:#c8d3e5;padding:12px;text-align:left;border-radius:10px;font-weight:800;margin-bottom:6px}aside .active,aside button:hover{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff}main{padding:20px}.page{display:none}.page.active{display:block}.head h1{margin:0}.head p{color:var(--muted);margin:5px 0 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.item{background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.grow{flex:1}.item small{display:block;color:var(--muted);font-size:10px}.chip{font-size:9px;padding:5px 8px;border-radius:999px;background:#4b1b36;color:#ffb2d4;font-weight:800}.btn{border:0;border-radius:9px;padding:9px 11px;background:var(--p);color:#fff;font-weight:800}.field{margin-bottom:10px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0b1325;border:1px solid var(--line);color:#fff;padding:10px;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}.notice{margin-top:14px;background:#3d310d;border:1px solid #725c19;color:#ffe7a3;padding:13px;border-radius:12px}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#172235;padding:10px 14px;border-radius:999px;opacity:0}.toast.show{opacity:1}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}aside button{width:auto;white-space:nowrap}.stats,.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.cards,.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><header><div class="brand">Bangla Calendar Admin Panel Demo<small>Digital Agency by Chandan Das • Client-safe preview</small></div><a class="back" href="bangla-calendar.html">← Project Page</a></header><div class="layout"><aside id="nav"></aside><main id="main"></main></div><div id="toast" class="toast"></div>
<script>
const pages=[['dashboard','📊 Dashboard'],['calendar','📅 Calendar Data'],['festivals','🎉 Festivals'],['panchang','📖 Panchang'],['notifications','🔔 Notifications'],['banners','🖼️ Banners'],['users','👥 Users'],['settings','⚙️ Settings']];let active='dashboard';
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function show(p){active=p;renderNav();render()}
function renderNav(){nav.innerHTML=pages.map(x=>`<button class="${active===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function rows(items){return items.map(x=>`<div class="item"><div class="grow"><b>${x[0]}</b><small>${x[1]}</small></div><span class="chip">${x[2]}</span></div>`).join('')}
function render(){let h='';if(active==='dashboard')h=`<div class="head"><h1>Admin Dashboard</h1><p>Bangla Calendar content and app management overview</p></div><div class="stats"><div class="stat"><small>Calendar Entries</small><strong>365</strong></div><div class="stat"><small>Festivals</small><strong>86</strong></div><div class="stat"><small>Notifications</small><strong>24</strong></div><div class="stat"><small>Active Users</small><strong>1,240</strong></div></div><div class="grid"><div class="box"><h3>Upcoming Festivals</h3>${rows([['পূর্ণিমা','৮ আগস্ট ২০২৬','Ready'],['জন্মাষ্টমী','১৮ আগস্ট ২০২৬','Scheduled'],['বিশ্বকর্মা পূজা','১৭ সেপ্টেম্বর ২০২৬','Draft']])}</div><div class="box"><h3>Quick Actions</h3><button class="btn" onclick="show('festivals')">Add Festival</button> <button class="btn" onclick="show('notifications')">Send Notification</button></div></div>`;
if(active==='calendar')h=`<div class="head"><h1>Calendar Data</h1><p>বাংলা তারিখ, তিথি এবং holiday data manage করুন</p></div><div class="box"><div class="field"><label>Date</label><input type="date"></div><div class="field"><label>বাংলা তারিখ</label><input value="১৭ শ্রাবণ ১৪৩৩"></div><div class="field"><label>Holiday Status</label><select><option>Normal Day</option><option>Holiday</option></select></div><button class="btn" onclick="toast('Calendar data saved in demo mode')">Save Calendar Entry</button></div>`;
if(active==='festivals')h=`<div class="head"><h1>Festival Management</h1><p>Add, edit and schedule festival content</p></div><div class="cards">${['পূর্ণিমা','একাদশী','অমাবস্যা','জন্মাষ্টমী','দুর্গাপূজা','কালীপূজা'].map(x=>`<div class="card"><h3>${x}</h3><p style="color:var(--muted)">Date, details and reminder</p><button class="btn" onclick="toast('${x} edit opened')">Edit</button></div>`).join('')}</div>`;
if(active==='panchang')h=`<div class="head"><h1>Panchang Management</h1><p>Tithi, Nakshatra, Yoga, Karana and Muhurat</p></div><div class="box">${['তিথি','নক্ষত্র','যোগ','করণ','রাহুকাল','শুভ মুহূর্ত'].map(x=>`<div class="field"><label>${x}</label><input placeholder="${x} data"></div>`).join('')}<button class="btn" onclick="toast('Panchang data saved')">Save Panchang</button></div>`;
if(active==='notifications')h=`<div class="head"><h1>Notification Management</h1><p>Festival and daily Panchang alerts</p></div><div class="box"><div class="field"><label>Audience</label><select><option>All Users</option><option>Selected Language</option></select></div><div class="field"><label>Title</label><input value="আগামীকাল একাদশী"></div><div class="field"><label>Message</label><textarea>উপবাস ও পারণের সময় দেখুন।</textarea></div><button class="btn" onclick="toast('Demo notification sent')">Send Notification</button></div>`;
if(active==='banners')h=`<div class="head"><h1>Banner Management</h1><p>Home banners and special announcements</p></div><div class="cards">${['Festival Banner','Daily Quote','Special Notice'].map(x=>`<div class="card"><h3>${x}</h3><p style="color:var(--muted)">Image • Link • Show/Hide</p><button class="btn" onclick="toast('${x} manager opened')">Manage</button></div>`).join('')}</div>`;
if(active==='users')h=`<div class="head"><h1>User Management</h1><p>App usage and notification preferences</p></div><div class="box">${rows([['Sangita Das','বাংলা • Notifications On','Active'],['Rahul Kumar','English • Notifications On','Active'],['Amit Sharma','বাংলা • Notifications Off','Inactive']])}</div>`;
if(active==='settings')h=`<div class="head"><h1>App Settings</h1><p>Language, calendar method and integrations</p></div><div class="cards">${[['Default Language','বাংলা'],['Calendar Method','বিশুদ্ধ সিদ্ধান্ত'],['Weather API','Demo Mode'],['Ads','Disabled'],['Maintenance','Off'],['App Version','4.0']].map(x=>`<div class="card"><small style="color:var(--muted)">${x[0]}</small><h3>${x[1]}</h3><button class="btn" onclick="toast('Setting edit opened')">Edit</button></div>`).join('')}</div><div class="notice"><b>Client Demo:</b> এটি project feature preview। কোনো private production data বা real admin login এখানে নেই।</div>`;main.innerHTML=h}
renderNav();render();
</script></body></html>
